<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Visualizador Suffix Tree de Ukkonen</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; display: flex; flex-direction: column; align-items: center; }
        #controls { margin: 20px; width: 80%; text-align: center; }
        textarea { width: 100%; height: 100px; border: 1px solid #ccc; border-radius: 5px; padding: 10px; }
        button { background: #28a745; color: white; border: none; padding: 10px 20px; cursor: pointer; font-size: 16px; margin-top: 10px; border-radius: 5px; }
        button:hover { background: #218838; }
        #tree-container { width: 95%; height: 800px; border: 1px solid #ddd; background: white; border-radius: 8px; overflow: auto; box-shadow: 0 0 10px rgba(0,0,0,0.1); }

        .node circle { fill: #fff; stroke: steelblue; stroke-width: 3px; cursor: pointer; }
        .node text { font: 12px sans-serif; }
        .link { fill: none; stroke: #ccc; stroke-width: 2px; }

        /* Estilo para los Suffix Links */
        .suffix-link { fill: none; stroke: #ff4444; stroke-width: 2px; stroke-dasharray: 5,5; opacity: 0.6; marker-end: url(#arrow); }

        .edge-label { font-size: 11px; fill: #555; font-family: monospace; background: white; }
        .edge-rect { fill: white; opacity: 0.8; }

        /* Controles de velocidad */
        #speed-controls { margin: 15px 0; display: flex; justify-content: center; gap: 10px; align-items: center; }
        .speed-btn { background: #007bff; color: white; border: none; padding: 8px 15px; cursor: pointer; font-size: 14px; border-radius: 5px; }
        .speed-btn:hover { background: #0056b3; }
        .speed-btn.active { background: #28a745; }
        #animation-status { margin: 10px; font-weight: bold; color: #555; }

        /* Controles de búsqueda */
        #search-controls { margin: 20px auto; max-width: 800px; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .search-section { margin: 15px 0; }
        .search-section label { display: block; margin-bottom: 5px; font-weight: bold; color: #333; }
        .search-section input { width: 60%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        .search-btn { background: #17a2b8; color: white; border: none; padding: 8px 20px; cursor: pointer; font-size: 14px; border-radius: 5px; margin-left: 10px; }
        .search-btn:hover { background: #138496; }
        .reset-btn { background: #6c757d; }
        .reset-btn:hover { background: #5a6268; }
        #search-result { margin-top: 15px; padding: 12px; border-radius: 5px; font-weight: bold; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }

        /* Nodos y enlaces resaltados durante búsqueda */
        .node.highlighted circle { fill: #ffc107 !important; stroke: #ff9800; stroke-width: 4px; animation: pulse 1s infinite; }
        .link-group.highlighted path { stroke: #ff9800 !important; stroke-width: 4px; }
        .link-group.highlighted .edge-label { fill: #ff6f00; font-weight: bold; }
        .node.found circle { fill: #4caf50 !important; stroke: #2e7d32; stroke-width: 4px; animation: found-pulse 0.5s; }
        .node.not-found circle { fill: #f44336 !important; stroke: #c62828; stroke-width: 4px; }
        .node.leaf-highlight circle { fill: #9c27b0 !important; stroke: #6a1b9a; stroke-width: 3px; animation: leaf-pulse 1s infinite; }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }
        @keyframes found-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.3); }
        }
        @keyframes leaf-pulse {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>

<div id="controls">
    <h3>Visualizador de Suffix Tree</h3>
    <textarea id="jsonInput" placeholder="Pega aquí el JSON generado por tu C++..."></textarea>
    <br>
    <button onclick="drawTree()">Renderizar Árbol</button>

    <div id="speed-controls">
        <span>Velocidad de animación:</span>
        <button class="speed-btn" onclick="setSpeed(0.25)">x0.25</button>
        <button class="speed-btn" onclick="setSpeed(0.5)">x0.5</button>
        <button class="speed-btn active" onclick="setSpeed(1)">x1</button>
        <button class="speed-btn" onclick="setSpeed(2)">x2</button>
        <button class="speed-btn" onclick="setSpeed(4)">x4</button>
        <button class="speed-btn" onclick="setSpeed(8)">x8</button>
    </div>

    <div id="animation-status"></div>
</div>

<div id="tree-container"></div>

<div id="search-controls" style="display: none;">
    <h4>🔍 Demostración de Búsqueda en Suffix Tree</h4>

    <div class="search-section">
        <label>Buscar Subcadena (existePalabra):</label>
        <input type="text" id="searchPattern" placeholder="Ingresa la subcadena a buscar...">
        <button class="search-btn" onclick="searchPattern()">Buscar</button>
    </div>

    <div class="search-section">
        <label>Contar Ocurrencias (cantidadVeces):</label>
        <input type="text" id="countPattern" placeholder="Ingresa el patrón a contar...">
        <button class="search-btn" onclick="countPattern()">Contar</button>
    </div>

    <div class="search-section">
        <button class="search-btn reset-btn" onclick="resetHighlights()">Limpiar Resaltados</button>
    </div>

    <div id="search-result"></div>
</div>

<script>
let animationSpeed = 1; // Velocidad por defecto
let svg, g, root, treeLayout, nodeMap;
let originalText = ""; // Texto original del suffix tree
let treeDataGlobal = null; // Datos del árbol

function setSpeed(speed) {
    animationSpeed = speed;
    // Actualizar botones activos
    document.querySelectorAll('.speed-btn').forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');
}

function drawTree() {
    const input = document.getElementById('jsonInput').value;
    if(!input.trim()) return alert("Por favor pega el JSON primero");

    let treeData;
    try {
        treeData = JSON.parse(input);
    } catch(e) {
        return alert("JSON inválido. Asegúrate de copiar todo desde { hasta }");
    }

    // Guardar datos globales
    treeDataGlobal = treeData;
    originalText = extractOriginalText(treeData);

    d3.select("#tree-container").selectAll("*").remove();
    document.getElementById('search-controls').style.display = 'none';

    // Tamaño aumentado para mejor visualización
    const width = 2400;
    const height = 1600;

    svg = d3.select("#tree-container").append("svg")
        .attr("width", width)
        .attr("height", height);

    g = svg.append("g")
        .attr("transform", "translate(100,100)");

    // Habilitar zoom
    svg.call(d3.zoom().on("zoom", (event) => {
        g.attr("transform", event.transform);
    }));

    // Marcador para suffix links
    svg.append("defs").append("marker")
        .attr("id", "arrow")
        .attr("viewBox", "0 -5 10 10")
        .attr("refX", 18)
        .attr("refY", 0)
        .attr("markerWidth", 6)
        .attr("markerHeight", 6)
        .attr("orient", "auto")
        .append("path")
        .attr("d", "M0,-5L10,0L0,5")
        .attr("fill", "#ff4444");

    root = d3.hierarchy(treeData);

    // Espaciado aumentado para cadenas grandes
    treeLayout = d3.tree()
        .size([width - 200, height - 300])
        .separation((a, b) => (a.parent == b.parent ? 1 : 1.5) * 2); // Más espacio entre nodos

    treeLayout(root);

    nodeMap = {};
    root.descendants().forEach(d => {
        nodeMap[d.data.name] = d;
    });

    // Iniciar animación
    animateTree();
}

async function animateTree() {
    const nodes = root.descendants();
    const links = root.links();

    // Crear mapa de suffix links
    const suffixLinks = [];
    nodes.forEach(d => {
        if (d.data.suffixLink && nodeMap[d.data.suffixLink]) {
            suffixLinks.push({source: d, target: nodeMap[d.data.suffixLink]});
        }
    });

    const delay = 500 / animationSpeed; // Delay base 500ms
    const statusDiv = document.getElementById('animation-status');

    // Animar nodos y enlaces uno por uno
    for (let i = 0; i < nodes.length; i++) {
        const node = nodes[i];
        statusDiv.textContent = `Construyendo árbol: ${i + 1}/${nodes.length} nodos`;

        // Si no es la raíz, añadir el enlace primero
        if (node.parent) {
            const link = links.find(l => l.target === node);
            if (link) {
                await animateLink(link, delay);
            }
        }

        // Luego añadir el nodo
        await animateNode(node, delay);
    }

    // Finalmente, añadir suffix links con animación
    statusDiv.textContent = `Añadiendo suffix links...`;
    for (const link of suffixLinks) {
        await animateSuffixLink(link, delay / 2);
    }

    statusDiv.textContent = `✓ Árbol completado (${nodes.length} nodos) - Texto: "${originalText}"`;

    // Mostrar controles de búsqueda
    document.getElementById('search-controls').style.display = 'block';
}

function animateLink(linkData, delay) {
    return new Promise(resolve => {
        const linkGroup = g.append("g")
            .attr("class", "link-group")
            .style("opacity", 0);

        linkGroup.append("path")
            .attr("class", "link")
            .attr("d", d3.linkVertical()
                .x(d => d.x)
                .y(d => d.y)(linkData));

        const x = (linkData.source.x + linkData.target.x) / 2;
        const y = (linkData.source.y + linkData.target.y) / 2;

        const labelGroup = linkGroup.append("g")
            .attr("transform", `translate(${x},${y})`);

        const edgeLabel = linkData.target.data.edgeLabel || "";
        const textWidth = edgeLabel.length * 7;
        const textHeight = 18;

        labelGroup.append("rect")
            .attr("class", "edge-rect")
            .attr("x", -textWidth/2 - 3)
            .attr("y", -textHeight/2)
            .attr("width", textWidth + 6)
            .attr("height", textHeight);

        labelGroup.append("text")
            .attr("class", "edge-label")
            .attr("dy", ".35em")
            .attr("text-anchor", "middle")
            .text(edgeLabel);

        // Animación de aparición
        linkGroup.transition()
            .duration(delay * 0.8)
            .style("opacity", 1)
            .on("end", resolve);
    });
}

function animateNode(nodeData, delay) {
    return new Promise(resolve => {
        const nodeGroup = g.append("g")
            .attr("class", "node")
            .attr("transform", `translate(${nodeData.x},${nodeData.y})`)
            .style("opacity", 0);

        nodeGroup.append("circle")
            .attr("r", 0)
            .style("fill", nodeData.children ? "#fff" : "#ffcc00");

        nodeGroup.append("text")
            .attr("dy", -15)
            .attr("text-anchor", "middle")
            .style("opacity", 0)
            .text(nodeData.data.name);

        // Animación de aparición
        nodeGroup.transition()
            .duration(delay)
            .style("opacity", 1);

        nodeGroup.select("circle")
            .transition()
            .duration(delay)
            .attr("r", 10);

        nodeGroup.select("text")
            .transition()
            .duration(delay)
            .style("opacity", 1)
            .on("end", resolve);
    });
}

function animateSuffixLink(linkData, delay) {
    return new Promise(resolve => {
        const suffixLink = g.append("path")
            .attr("class", "suffix-link")
            .style("opacity", 0)
            .attr("d", () => {
                const path = d3.path();
                path.moveTo(linkData.source.x, linkData.source.y);
                path.quadraticCurveTo(
                    (linkData.source.x + linkData.target.x) / 2 + 50,
                    (linkData.source.y + linkData.target.y) / 2,
                    linkData.target.x, linkData.target.y
                );
                return path.toString();
            });

        suffixLink.transition()
            .duration(delay)
            .style("opacity", 0.6)
            .on("end", resolve);
    });
}

// ============================================
// FUNCIONES DE BÚSQUEDA Y CONTEO
// ============================================

// Extraer texto original del árbol usando los índices
function extractOriginalText(treeData) {
    let maxIndex = -1;
    const segments = [];

    function traverse(node) {
        if (node.indices && node.edgeLabel && node.edgeLabel !== "ROOT") {
            const [start, end] = node.indices;
            if (end > maxIndex) maxIndex = end;
            segments.push({ start, end, label: node.edgeLabel });
        }
        if (node.children && node.children.length > 0) {
            node.children.forEach(child => traverse(child));
        }
    }

    traverse(treeData);

    // Reconstruir el texto usando los índices
    if (maxIndex === -1) return "";

    const textArray = new Array(maxIndex + 1).fill('?');

    // Colocar cada segmento en su posición correcta
    segments.forEach(seg => {
        for (let i = 0; i < seg.label.length && (seg.start + i) <= seg.end; i++) {
            textArray[seg.start + i] = seg.label[i];
        }
    });

    // Unir y remover el marcador $
    return textArray.join('').replace(/\$+$/, '');
}

// Limpiar todos los resaltados
function resetHighlights() {
    g.selectAll('.node').classed('highlighted found not-found leaf-highlight', false);
    g.selectAll('.link-group').classed('highlighted', false);
    document.getElementById('search-result').innerHTML = '';
    document.getElementById('search-result').className = '';
}

// Buscar patrón (implementación exacta de existePalabra del C++)
async function searchPattern() {
    const pattern = document.getElementById('searchPattern').value;
    if (!pattern) {
        alert('Por favor ingresa un patrón para buscar');
        return;
    }

    resetHighlights();
    const resultDiv = document.getElementById('search-result');
    const delay = 800 / animationSpeed;

    resultDiv.className = 'info';
    resultDiv.innerHTML = `🔍 Buscando patrón "${pattern}" en "${originalText}"...`;

    // Algoritmo existePalabra - SufffixNode* camino = raiz;
    let camino = root;
    let indicePatron = 0;
    const n = pattern.length;

    // Resaltar nodo raíz
    highlightNode(camino, 'highlighted');
    await sleep(delay);

    // while (indicePatron < buscar.size())
    while (indicePatron < pattern.length) {
        const caracterActual = pattern[indicePatron];

        resultDiv.innerHTML = `🔍 Buscando carácter '${caracterActual}' (índice ${indicePatron}) en "${originalText}"...`;

        // Buscar hijo que empiece con caracterActual
        // if (!camino->hijos.contains(caracterActual))
        let encontrado = null;
        for (const child of camino.children || []) {
            const edgeLabel = child.data.edgeLabel || "";
            if (edgeLabel.length > 0 && edgeLabel[0] === caracterActual) {
                encontrado = child;
                break;
            }
        }

        if (!encontrado) {
            // return false
            highlightNode(camino, 'not-found');
            await sleep(delay);
            resultDiv.className = 'error';
            resultDiv.innerHTML = `❌ Patrón "${pattern}" NO encontrado en "${originalText}"<br>` +
                                  `No existe hijo con carácter '${caracterActual}' desde el nodo ${camino.data.name}`;
            return;
        }

        // camino = camino->hijos[caracterActual];
        await highlightPath(camino, encontrado, delay);
        camino = encontrado;

        const edgeLabel = camino.data.edgeLabel || "";
        const tamanioCamino = edgeLabel.length;

        // for (int i = 0; i < tamanioCamino; i++)
        for (let i = 0; i < tamanioCamino; i++) {
            // if (indicePatron == n) return true
            if (indicePatron === n) {
                highlightNode(camino, 'found');
                await sleep(delay);
                resultDiv.className = 'success';
                resultDiv.innerHTML = `✅ Patrón "${pattern}" ENCONTRADO en "${originalText}"`;
                return;
            }

            // char charEnArbol = palabra[camino->inicio + i];
            const charEnArbol = edgeLabel[i];
            // char charEnPatron = buscar[indicePatron];
            const charEnPatron = pattern[indicePatron];

            resultDiv.innerHTML = `🔍 Comparando '${charEnPatron}' con '${charEnArbol}' en edge "${edgeLabel}" (pos ${i})`;

            // if (charEnPatron != charEnArbol) return false
            if (charEnPatron !== charEnArbol) {
                highlightNode(camino, 'not-found');
                await sleep(delay);
                resultDiv.className = 'error';
                resultDiv.innerHTML = `❌ Patrón "${pattern}" NO encontrado en "${originalText}"<br>` +
                                      `Esperaba '${charEnPatron}' pero encontró '${charEnArbol}' en nodo ${camino.data.name}`;
                return;
            }

            // indicePatron++
            indicePatron++;
            await sleep(delay / 2);
        }
    }

    // return true
    highlightNode(camino, 'found');
    await sleep(delay);
    resultDiv.className = 'success';
    resultDiv.innerHTML = `✅ Patrón "${pattern}" ENCONTRADO en "${originalText}"`;
}

// Contar ocurrencias (implementación exacta de cantidadVeces del C++)
async function countPattern() {
    const pattern = document.getElementById('countPattern').value;
    if (!pattern) {
        alert('Por favor ingresa un patrón para contar');
        return;
    }

    resetHighlights();
    const resultDiv = document.getElementById('search-result');
    const delay = 800 / animationSpeed;

    resultDiv.className = 'info';
    resultDiv.innerHTML = `🔢 Contando ocurrencias de "${pattern}" en "${originalText}"...`;

    // Algoritmo cantidadVeces - SufffixNode* camino = raiz;
    let camino = root;
    const n = pattern.length;
    let i = 0;

    // Resaltar nodo raíz
    highlightNode(camino, 'highlighted');
    await sleep(delay);

    // while (i < n)
    while (i < n) {
        const charActual = pattern[i];

        resultDiv.innerHTML = `🔢 Buscando carácter '${charActual}' (índice ${i}) en "${originalText}"...`;

        // if (camino->hijos.find(charActual) == camino->hijos.end()) return 0
        let encontrado = null;
        for (const child of camino.children || []) {
            const edgeLabel = child.data.edgeLabel || "";
            if (edgeLabel.length > 0 && edgeLabel[0] === charActual) {
                encontrado = child;
                break;
            }
        }

        if (!encontrado) {
            // return 0
            highlightNode(camino, 'not-found');
            await sleep(delay);
            resultDiv.className = 'error';
            resultDiv.innerHTML = `❌ Patrón "${pattern}" NO encontrado en "${originalText}"<br>` +
                                  `Ocurrencias: 0`;
            return;
        }

        // camino = camino->hijos[charActual];
        await highlightPath(camino, encontrado, delay);
        camino = encontrado;

        const edgeLabel = camino.data.edgeLabel || "";
        const tamanioCamino = edgeLabel.length;

        // for (int j = 0; j < tamanioCamino && i < n; j++)
        for (let j = 0; j < tamanioCamino && i < n; j++) {
            // char charEnArbol = palabra[camino->inicio + j];
            const charEnArbol = edgeLabel[j];
            // char charEnPatron = buscar[i];
            const charEnPatron = pattern[i];

            resultDiv.innerHTML = `🔢 Comparando '${charEnPatron}' con '${charEnArbol}' en edge "${edgeLabel}" (pos ${j})`;

            // if (charEnPatron != charEnArbol) return 0
            if (charEnPatron !== charEnArbol) {
                highlightNode(camino, 'not-found');
                await sleep(delay);
                resultDiv.className = 'error';
                resultDiv.innerHTML = `❌ Patrón "${pattern}" NO encontrado en "${originalText}"<br>` +
                                      `Ocurrencias: 0`;
                return;
            }

            // i++
            i++;
            await sleep(delay / 2);
        }
    }

    // return contarHojas(camino);
    resultDiv.innerHTML = `✅ Patrón encontrado. Contando hojas del subárbol...`;
    const leafCount = await countLeavesWithAnimation(camino, delay);

    highlightNode(camino, 'found');
    await sleep(delay);

    resultDiv.className = 'success';
    resultDiv.innerHTML = `✅ Patrón "${pattern}" encontrado ${leafCount} vez/veces en "${originalText}"<br>` +
                          `📊 Se contaron ${leafCount} hoja(s) en el subárbol (cada hoja = 1 ocurrencia)`;
}

// Resaltar camino entre dos nodos
async function highlightPath(fromNode, toNode, delay) {
    // Resaltar el nodo actual
    highlightNode(fromNode, 'highlighted');

    // Buscar y resaltar el enlace
    const links = g.selectAll('.link-group');
    links.each(function(d) {
        if (d && d.target === toNode) {
            d3.select(this).classed('highlighted', true);
        }
    });

    await sleep(delay);

    // Resaltar el nodo destino
    highlightNode(toNode, 'highlighted');
}

// Resaltar un nodo
function highlightNode(node, className) {
    const nodes = g.selectAll('.node');
    nodes.each(function(d) {
        if (d === node) {
            d3.select(this).classed(className, true);
        }
    });
}

// Contar hojas con animación
async function countLeavesWithAnimation(node, delay) {
    if (!node.children || node.children.length === 0) {
        highlightNode(node, 'leaf-highlight');
        await sleep(delay / 2);
        return 1;
    }

    let total = 0;
    for (const child of node.children) {
        total += await countLeavesWithAnimation(child, delay);
    }
    return total;
}

// Función auxiliar de sleep
function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
}
</script>

</body>
</html>
